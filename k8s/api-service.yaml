apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: mce-utility
    tier: api
spec:
  # Type ClusterIP pour un accès interne. Utilisez NodePort ou LoadBalancer pour exposition externe.
  type: ClusterIP 
  selector:
    app: mce-utility
    tier: api
  ports:
    - protocol: TCP
      port: 80     # Port exposé par le Service (convention HTTP)
      targetPort: 5000 # Port sur lequel le conteneur écoute réellement
