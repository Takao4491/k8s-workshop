version: "3.9"

services:
  api:
    build: ../app/api
    container_name: datapress-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    restart: unless-stopped

  front:
    build: ../app/front
    container_name: datapress-front
    ports:
      - "80:80"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5000
    restart: unless-stopped

networks:
  default:
    name: datapress-net
